name: "LTBL Build"

on:
    push:
        branches: [main]
        paths-ignore:
            - "README.md"
            - "docs/**"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        uses: ./.github/workflows/_shared-build.yaml
        with:
            ref: ${{ github.sha }}
            repository: ${{ github.repository }}
            run-cpp: true
            run-shader-validation: false
            cmake-preset: "ALL"

    release:
        name: Publish MO2-ready download
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout release notes
              uses: actions/checkout@v6
              with:
                  sparse-checkout: |
                      ltbl-release.txt
                      docs/release-notes
                  persist-credentials: false

            - name: Decide whether this build is a new versioned release
              id: ver
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  v=$(tr -d '[:space:]' < ltbl-release.txt)
                  echo "version=$v" >> "$GITHUB_OUTPUT"
                  if gh release view "$v" -R "${{ github.repository }}" >/dev/null 2>&1; then
                    echo "new=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "new=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download build output
              uses: actions/download-artifact@v4
              with:
                  name: dist-artifacts
                  path: dist

            - name: Pick the all-in-one package
              id: pick
              run: |
                  f=$(ls dist/*_AIO-*.7z | head -n1)
                  mkdir -p out
                  cp "$f" "out/LetThereBeLight-AIO.7z"
                  cp "$f" "out/LetThereBeLight-${{ steps.ver.outputs.version }}.7z"
                  echo "file=out/LetThereBeLight-AIO.7z" >> "$GITHUB_OUTPUT"
                  echo "vfile=out/LetThereBeLight-${{ steps.ver.outputs.version }}.7z" >> "$GITHUB_OUTPUT"
                  echo "built=$(basename "$f")" >> "$GITHUB_OUTPUT"

            - name: Remove the previous "latest" release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete latest --cleanup-tag -y -R "${{ github.repository }}" || true

            - name: Publish the latest build
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  name: "Let There Be Light (latest build)"
                  prerelease: true
                  make_latest: false
                  body: |
                      Latest automatic build of Let There Be Light. May be untested.
                      Install in MO2: Downloads > Install a new mod from an archive > LetThereBeLight-AIO.7z
                      Source package: ${{ steps.pick.outputs.built }}
                      Commit: ${{ github.sha }}
                  files: ${{ steps.pick.outputs.file }}

            - name: Publish the versioned release
              if: steps.ver.outputs.new == 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.ver.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: "Let There Be Light ${{ steps.ver.outputs.version }}"
                  prerelease: ${{ contains(steps.ver.outputs.version, 'beta') || contains(steps.ver.outputs.version, 'alpha') }}
                  make_latest: true
                  body_path: docs/release-notes/${{ steps.ver.outputs.version }}.md
                  files: ${{ steps.pick.outputs.vfile }}
